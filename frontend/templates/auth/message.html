{% extends "auth/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block card_name %}account{% endblock %}
{% block content %}
  <h1 class="auth-card__title">{{ heading }}</h1>
  <p class="auth-card__text">{{ text }}</p>
  {% if link %}
    <a href="{{ link }}" class="btn btn--primary auth-form__submit">{{ link_text }}</a>
  {% endif %}
{% endblock %}
