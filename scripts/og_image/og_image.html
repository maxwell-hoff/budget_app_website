<!DOCTYPE html>
<!-- Source of frontend/static/og-image.png (the link preview card). Re-render with
     scripts/og_image/render.sh after editing. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: "Cormorant Garamond", Georgia, serif;
    color: #14142b;
    background:
      radial-gradient(900px 500px at 105% 110%, rgba(10, 95, 174, 0.16), transparent 60%),
      radial-gradient(700px 400px at -10% -20%, rgba(0, 58, 112, 0.08), transparent 60%),
      #eef0f4;
    position: relative;
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 540px;
          display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 700;
           letter-spacing: -0.01em; color: #003a70; margin-bottom: 34px; }
  .brand svg { width: 54px; height: 46px; filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.45)); }
  h1 { margin: 0; font-size: 64px; line-height: 1.04; letter-spacing: -0.02em; font-weight: 700; }
  p { margin: 26px 0 0; font-size: 28px; line-height: 1.25; color: #3d3d5c; font-weight: 500; }
  .url { position: absolute; left: 72px; bottom: 40px; font-size: 24px; font-weight: 600;
         color: #0a5fae; letter-spacing: 0.02em; }

  .reel { position: absolute; left: 660px; top: 92px; width: 640px;
          background: #0c0f14; border: 1px solid rgba(20, 20, 43, 0.85); border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 2px 6px rgba(20,20,43,.06), 0 24px 50px -12px rgba(0,40,80,.35), 0 50px 80px -32px rgba(20,20,43,.3); }
  .bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 16px;
         background: linear-gradient(180deg, #2d2d4a, #14142b); border-bottom: 1px solid rgba(0,0,0,.55);
         position: relative; }
  .bar span { width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,.22); }
  .bar span:first-child { background: #0a5fae; box-shadow: 0 0 8px rgba(10,95,174,.9); }
  .bar b { position: absolute; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.7);
           font-size: 15px; letter-spacing: 0.1em; font-weight: 600; text-transform: uppercase; }
  .reel img { display: block; width: 640px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <svg viewBox="3 4.5 26 22" aria-hidden="true">
        <path d="M7 16 C12 16 14 8 21 8" stroke="#7c8aa0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="21" cy="8" r="2.5" fill="#7c8aa0"/>
        <path d="M7 16 C13 16 18 23 26 23" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="7" cy="16" r="3" fill="#38bdf8"/>
        <circle cx="26" cy="23" r="3" fill="#38bdf8"/>
      </svg>
      Workbench Budgeting
    </div>
    <h1>The budgeting app for working through big decisions.</h1>
    <p>Rent or buy? Afford the car? On track for retirement? Track your spending, then answer the big questions.</p>
  </div>
  <div class="url">workbenchbudgeting.com</div>

  <div class="reel">
    <div class="bar"><span></span><span></span><span></span><b>Workbench Budgeting</b></div>
    <img src="../../frontend/static/videos/showcase.jpg" alt="" />
  </div>
</body>
</html>
